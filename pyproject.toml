[project]
name = "dxf-translate"
version = "0.1.0"
description = "UA to EN translator for SolidWorks DXF drawings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["ezdxf==1.4.5", "pymupdf", "openpyxl", "pyyaml"]

[project.optional-dependencies]
gui = ["PySide6"]

[dependency-groups]
dev = ["pytest", "pyinstaller"]

[project.scripts]
dxf-translate = "dxf_translate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dxf_translate"]
include = ["src/dxf_translate/fonts/*", "src/dxf_translate/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
