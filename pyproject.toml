[project]
name = "dxf-translate"
dynamic = ["version"]
description = "UA to EN translator for SolidWorks DXF drawings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ezdxf==1.4.5",
    "pymupdf",
    "openpyxl",
    "pyyaml",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
gui = ["PySide6"]

[dependency-groups]
dev = [
    "pytest",
    "pyinstaller",
    "pytest-qt>=4.5.0",
]

[project.scripts]
dxf-translate = "dxf_translate.cli:main"
dxf-translate-gui = "dxf_translate.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dxf_translate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dxf_translate"]
include = ["src/dxf_translate/fonts/*", "src/dxf_translate/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-p no:pytest-qt"
