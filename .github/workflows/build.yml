name: build

# Every push to master and manual runs build the exe as a workflow artifact;
# a v* tag additionally publishes it as a GitHub Release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra gui
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # compare inside Python: avoids a trailing \r from Windows stdout breaking the test
        run: >
          uv run python -c "import sys, dxf_translate as d;
          t = sys.argv[1]; v = 'v' + d.__version__;
          sys.exit(0 if t == v else f'::error::tag {t} does not match __version__ {v} (src/dxf_translate/__init__.py)')"
          "${{ github.ref_name }}"
      - run: uv run pytest
      - run: uv run pyinstaller --noconfirm packaging/dxf-translate.spec
      - name: Selftest frozen exe
        shell: pwsh
        run: |
          # windowed exe: PowerShell does not wait for it nor see its exit code unless asked
          $p = Start-Process -FilePath dist\dxf-translate.exe -ArgumentList '--selftest' `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.out -Pattern 'selftest OK' -Quiet)) {
            throw "selftest printed no OK line"
          }
      - name: Name the exe
        id: name
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "file=dxf-translate-${{ github.ref_name }}.exe" >> "$GITHUB_OUTPUT"
          else
            echo "file=dxf-translate-${GITHUB_SHA::7}.exe" >> "$GITHUB_OUTPUT"
          fi
      - name: Rename
        shell: pwsh
        run: Copy-Item dist\dxf-translate.exe "${{ steps.name.outputs.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ steps.name.outputs.file }}
