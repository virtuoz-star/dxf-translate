name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra gui
      - name: Tag matches package version
        shell: bash
        run: |
          v=$(uv run python -c "import dxf_translate; print(dxf_translate.__version__)")
          if [ "${{ github.ref_name }}" != "v$v" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match __version__ $v (src/dxf_translate/__init__.py)"
            exit 1
          fi
      - run: uv run pytest
      - run: uv run pyinstaller --noconfirm packaging/dxf-translate.spec
      - name: Selftest frozen exe
        shell: pwsh
        run: |
          # windowed exe: PowerShell does not wait for it nor see its exit code unless asked
          $p = Start-Process -FilePath dist\dxf-translate.exe -ArgumentList '--selftest' `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path selftest.out -Pattern 'selftest OK' -Quiet)) {
            throw "selftest printed no OK line"
          }
      - name: Rename
        shell: pwsh
        run: Copy-Item dist\dxf-translate.exe "dxf-translate-${{ github.ref_name }}.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: dxf-translate-${{ github.ref_name }}.exe
