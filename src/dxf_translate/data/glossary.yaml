# Whole-text phrases (part names, view labels, BOM header, leader notes line by line)
  # part names
phrases:
  Кожух нижній: Bottom cover
  Корпус коробки: Box housing
  Профіль корпусу: Housing profile
  Стінка торцева: End wall
  Балка: Beam
  Втулка різьбова: Threaded bushing
  Стінки коробки: Box walls
  # view labels
  Розгортка: Flat pattern
  Б: B
  Б-Б: B-B
  # BOM header
  Ф: F
  Поз.: Item
  Позначення: Part No.
  Назва: Name
  Кільк.: Qty
  Матеріал: Material
  Довжина: Length
  # production list (translation file): section rows and the Ф column
  Деталі: Parts
  Зварювальні роботи: Welded assemblies
  Контрольні збірки: Test assemblies
  СК: AD
  # leader notes (SolidWorks splits them into lines)
  Площини прилягання до: Surfaces mating with
  інших деталей -: other parts -
  зачистити шви: grind welds flush
  після зварювання: after welding
  Площина прилягання з кришкою -: Lid mating surface -
  пофрезерувати після зварювання: mill after welding
  на глибину до 0,2 мм: to a depth of up to 0,2 mm
  Площина прилягання до корпусу -: Housing mating surface -
  пофрезерувати по периметру на глибину до 0,4 мм: mill along the perimeter to a depth of up to 0,4 mm
  Ручка: Handle
  Розмір: Size
  # source error in AS029v2.011.000 BOM item 8 (material cell overwritten in SolidWorks)
  сів аів: Round bar 12 Aluminum EN AW-6063 T5
  # purchased parts (module BOMs)
  AS.P.012 Замок ABLOY CL103: AS.P.012 Lock ABLOY CL103
  Замок ABLOY CL103: Lock ABLOY CL103
  Вентилятор 120*120*25: Fan 120x120x25
  Гніздо N-type: N-type jack
  Роз'єм N-type: N-type connector
  Роз'єм WEIPU SA24: Connector WEIPU SA24
  Роз'єм Weipu RJ45: Connector Weipu RJ45
  Роз'єм WY24KRJ45Z: Connector WY24KRJ45Z
  Роз'єм Weipu Ethernet: Connector Weipu Ethernet
  Роз'єм Weipu живлення: Connector Weipu power

# Material: full form for the info block
full_material:
  Лист 3 алюм.: Sheet 3 Aluminum EN AW-6063 T5
  Лист 5 алюм.: Sheet 5 Aluminum EN AW-6063 T5
  Труба проф. 15*15*1,5 Алюм: Square tube 15x15x1,5 Aluminum EN AW-6063 T5
  Круг 12 алюм.: Round bar 12 Aluminum EN AW-6063 T5

# Material: short form for the narrow BOM column (drawing BOM must match the Excel list word for word)
bom_material:
  Лист 3 алюм.: Sheet 3 Aluminum EN AW-6063 T5
  Лист 5 алюм.: Sheet 5 Aluminum EN AW-6063 T5
  Труба проф. 15*15*1,5 Алюм: Square tube 15x15x1,5 Aluminum EN AW-6063 T5
  Круг 12 алюм.: Round bar 12 Aluminum EN AW-6063 T5

# Technical requirements (one item per line)
notes:
  '*Розмір для довідок.': '*Reference dimension.'
  h14; H14; +/- JT14/2.: h14; H14; +/- JT14/2.
  Гострі крайки притупити.: Break sharp edges.
  Зварювати за можливим контуром прилягання деталей.: Weld along all accessible mating contours of the parts.
  Зварні шви зачистити по зовнішнім граням коробки та зверху втулок поз.7.: Grind welds flush on the outer faces of the box and on top of the bushings, item 7.
  '** Різьбу нарізати після зварювання.': '** Cut threads after welding.'
  Різьбу нарізати після зварювання.: Cut threads after welding.

# Regex replacements inside callouts / dimension texts / free notes (applied in order)
substr:
- - (?<![А-Яа-яІіЇїЄє])М(?![А-Яа-яІіЇїЄє])
  - M
- - (\d+)\s*(?:отв|ов|тв)\.
  - \1 X
- - наскрізн(?:і|ий|а)
  - THRU
- - фаски
  - chamfers
- - паза
  - slots
- - Розгортка
  - Flat pattern
- - Масштаб
  - Scale
- - ВИД
  - VIEW
- - Вид
  - View
- - Зображено
  - as shown
- - Відобразити дзеркально
  - mirror image
- - покупне
  - purchased

# user: no "(welded assembly)" next to the name
assembly_suffix: ''

# regex a Part No. must match (title block on the sheet, "Позначення" column in Excel);
# an order glossary.yaml may override it, e.g. "^(AS|BK)"
part_no_pattern: "^AS"
